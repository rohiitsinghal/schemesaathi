<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchemeSaathi — every scheme you deserve</title>
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<style>
:root{--ink:#17222b;--muted:#5b6770;--bg:#fffaf3;--card:#fff;--line:#eadfce;--teal:#0f3d3e;--teal2:#16595a;--saffron:#f4a53a;--green:#1f8a4c;--green-bg:#e7f5ec;--amber-bg:#fff3d9;--amber:#9a6200;--blue-bg:#e8f0fe;--blue:#1f4fb4;--red-bg:#fdeaea;--red:#b42318;--radius:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--teal);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand img{width:32px;height:32px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:-3px}
.lang button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.lang button.on{background:var(--saffron);color:var(--teal);border-color:var(--saffron);font-weight:700}
nav{display:flex;gap:6px;margin:16px 0 8px;overflow-x:auto}
nav button{flex:1;min-width:max-content;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.hero{padding:18px 0 4px}
.hero h1{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--teal)}
.hero p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
textarea,input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #d9cfbf;border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:0 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:0;background:var(--teal);color:#fff;padding:11px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal2)}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.saffron{background:var(--saffron);color:var(--teal)}
.mic{width:46px;height:46px;border-radius:50%;border:0;background:var(--saffron);font-size:20px;cursor:pointer;flex:none}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#f4ede0;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.fact{background:var(--blue-bg);border-color:#c7d7fb;color:var(--blue);cursor:default}
.chip.fact b{cursor:pointer;margin-left:6px;opacity:.7}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none}
.banner{background:linear-gradient(135deg,var(--teal),#1b6b5f);color:#fff;border-radius:var(--radius);padding:18px;margin:14px 0}
.banner h2{margin:0 0 2px;font-size:15px;font-weight:600;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:10px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;opacity:.85}
.scheme{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px;margin:12px 0}
.scheme h3{margin:0;font-size:17px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-right:6px}
.b-eligible{background:var(--green-bg);color:var(--green)}
.b-likely{background:var(--amber-bg);color:var(--amber)}
.b-near_miss{background:var(--blue-bg);color:var(--blue)}
.b-level{background:#f1f1f1;color:#555;font-weight:600}
.benefit{margin:8px 0;font-size:15px}
.why{font-size:13px;color:var(--muted)}
.why li{margin:2px 0}
.near{background:var(--blue-bg);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.warn{background:var(--amber-bg);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--teal);font-weight:600}
details ul,details ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.q{background:var(--amber-bg);border:1px solid #f0d9a4;border-radius:14px;padding:12px;margin:12px 0}
.q .row{margin-top:8px}
.risk{border-radius:14px;padding:14px;margin-top:12px}
.risk.high{background:var(--red-bg);color:var(--red)}
.risk.medium{background:var(--amber-bg);color:var(--amber)}
.risk.low{background:var(--green-bg);color:var(--green)}
.member{border:1px dashed #d9cfbf;border-radius:14px;padding:12px;margin:10px 0}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;padding:24px 0 40px}
h2.sec{font-size:18px;margin:22px 0 4px;color:var(--teal)}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="brand"><img src="/icon.svg" alt=""><div>SchemeSaathi<small id="tag"></small></div></div>
    <div class="lang"><button id="l-en" class="on">EN</button> <button id="l-hi">हिन्दी</button></div>
  </div>
</header>

<main class="wrap">
  <div class="hero"><h1 id="h1"></h1><p id="sub"></p></div>
  <nav>
    <button id="t-find" class="on"></button>
    <button id="t-family"></button>
    <button id="t-scam"></button>
  </nav>

  <!-- FIND -->
  <section id="p-find">
    <div class="card">
      <label id="lbl-say"></label>
      <div class="row" style="flex-wrap:nowrap">
        <textarea id="said"></textarea>
        <button class="mic" id="mic" title="Speak">🎤</button>
      </div>
      <div class="chips" id="examples"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="go"></button>
        <button class="btn alt" id="toggle-form"></button>
        <span class="muted" id="mic-note"></span>
      </div>
      <div id="form" class="hidden" style="margin-top:14px">
        <div class="grid" id="form-grid"></div>
      </div>
      <div class="chips" id="facts"></div>
    </div>
    <div id="followups"></div>
    <div id="results"></div>
  </section>

  <!-- FAMILY -->
  <section id="p-family" class="hidden">
    <div class="card">
      <h3 style="margin:0 0 4px" id="fam-h"></h3>
      <p class="muted" id="fam-p" style="margin:0 0 10px"></p>
      <div class="grid" id="hh-grid"></div>
      <div id="members"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn alt sm" id="add-member"></button>
        <button class="btn saffron sm" id="demo-family"></button>
        <button class="btn" id="go-family"></button>
      </div>
    </div>
    <div id="family-results"></div>
  </section>

  <!-- SCAM -->
  <section id="p-scam" class="hidden">
    <div class="card">
      <h3 style="margin:0 0 4px" id="sc-h"></h3>
      <p class="muted" id="sc-p" style="margin:0 0 10px"></p>
      <textarea id="scam-text"></textarea>
      <div class="chips" id="scam-examples"></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="go-scam"></button></div>
      <div id="scam-out"></div>
    </div>
  </section>

  <div class="disclaimer" id="disc"></div>
</main>

let lang = localStorage.getItem('ss_lang') || 'en';
const t = () => T[lang];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const STATES = ["andhra pradesh","assam","bihar","chhattisgarh","delhi","gujarat","haryana","himachal pradesh","jharkhand","karnataka","kerala","madhya pradesh","maharashtra","odisha","punjab","rajasthan","tamil nadu","telangana","uttar pradesh","uttarakhand","west bengal"];
const cap = s => s.replace(/\b\w/g, c => c.toUpperCase());
const BOOL_FIELDS = new Set(["bpl","owns_pucca_house","has_bank_account","income_tax_payer","girl_child_under10","disabled","pregnant","epfo_member","has_lpg","top20_percentile"]);

let profile = {};
let lastMatch = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : undefined);

  return r.json();
}

/* ------------------------------------------------------------ voice */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('mic').onclick = () => {
  if (!SR) { $('mic-note').textContent = t().micNo; return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = lang==='hi' ? 'hi-IN' : 'en-IN'; rec.interimResults = true; rec.continuous = false;
  const base = $('said').value ? $('said').value + ' ' : '';
  rec.onstart = () => { $('mic').classList.add('rec'); $('mic-note').textContent = t().listening; };
  rec.onresult = e => { $('said').value = base + [...e.results].map(r => r[0].transcript).join(' '); };
  rec.onerror = () => {};
  rec.onend = () => { $('mic').classList.remove('rec'); $('mic-note').textContent = t().micNote; rec = null; if ($('said').value.trim()) findFromText(); };
  rec.start();
};
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = lang==='hi' ? 'hi-IN' : 'en-IN'; speechSynthesis.speak(u);
}

/* ------------------------------------------------------------ profile facts + form */
function factText(k, v) {
  const L = t().fieldsLabel[k] || k;
  let val = v;
  if (typeof v === 'boolean') val = v ? t().yes : t().no;
  else if (k==='annual_income') val = inr(v);
  else if (k==='land_acres') val = v + ' ac';
  else if (k==='occupation') val = t().occ[v] || v;
  else if (k==='category') val = t().cat[v] || v;
  else if (k==='gender') val = v==='female' ? t().female : t().male;
  else if (k==='rural') val = v ? t().village : t().city;
  else if (k==='state') val = cap(v);
  return `${L}: ${val}`;
}
function renderFacts() {
  const keys = Object.keys(profile);
  $('facts').innerHTML = keys.length ? `<span class="muted">${t().youSaid}:</span>` + keys.map(k =>
    `<span class="chip fact">${esc(factText(k, profile[k]))}<b data-k="${k}" title="${t().remove}">×</b></span>`).join('') : '';
  $('facts').querySelectorAll('b').forEach(b => b.onclick = () => { delete profile[b.dataset.k]; renderFacts(); runMatch(); });
}
function field(label, inner) { return `<div><label>${esc(label)}</label>${inner}</div>`; }
const triSel = (id, cur) => `<select id="${id}"><option value="">${t().unknown}</option><option value="1" ${cur===true?'selected':''}>${t().yes}</option><option value="0" ${cur===false?'selected':''}>${t().no}</option></select>`;
function buildForm() {
  const p = profile;
  $('form-grid').innerHTML =
    field(t().fieldsLabel.age, `<input id="f-age" type="number" min="5" max="110" value="${p.age ?? ''}">`) +
    field(t().fieldsLabel.gender, `<select id="f-gender"><option value="">${t().unknown}</option><option value="male" ${p.gender==='male'?'selected':''}>${t().male}</option><option value="female" ${p.gender==='female'?'selected':''}>${t().female}</option></select>`) +
    field(t().fieldsLabel.state, `<select id="f-state"><option value="">${t().unknown}</option>${STATES.map(s=>`<option value="${s}" ${p.state===s?'selected':''}>${cap(s)}</option>`).join('')}</select>`) +
    field(t().fieldsLabel.occupation, `<select id="f-occupation"><option value="">${t().unknown}</option>${Object.entries(t().occ).map(([k,v])=>`<option value="${k}" ${p.occupation===k?'selected':''}>${v}</option>`).join('')}</select>`) +
    field(t().fieldsLabel.category, `<select id="f-category"><option value="">${t().unknown}</option>${Object.entries(t().cat).map(([k,v])=>`<option value="${k}" ${p.category===k?'selected':''}>${v}</option>`).join('')}</select>`) +
    field(t().hhIncome, `<input id="f-annual_income" type="number" min="0" step="1000" value="${p.annual_income ?? ''}">`) +
    field(t().acres, `<input id="f-land_acres" type="number" min="0" step="0.5" value="${p.land_acres ?? ''}">`) +
    field(t().hhRural, `<select id="f-rural"><option value="">${t().unknown}</option><option value="1" ${p.rural===true?'selected':''}>${t().village}</option><option value="0" ${p.rural===false?'selected':''}>${t().city}</option></select>`) +
    ['bpl','has_bank_account','income_tax_payer','owns_pucca_house'].map(k => field(t().fieldsLabel[k], triSel('f-'+k, p[k]))).join('');
  $('form-grid').querySelectorAll('input,select').forEach(el => el.onchange = formChanged);
}
function formChanged() {
  const g = id => $('f-'+id).value;
  const set = (k, v) => { if (v === '' || v === null || Number.isNaN(v)) delete profile[k]; else profile[k] = v; };
  set('age', g('age')==='' ? '' : +g('age')); set('gender', g('gender')); set('state', g('state')); set('occupation', g('occupation')); set('category', g('category'));
  set('annual_income', g('annual_income')==='' ? '' : +g('annual_income')); set('land_acres', g('land_acres')==='' ? '' : +g('land_acres'));
  set('rural', g('rural')==='' ? '' : g('rural')==='1');
  ['bpl','has_bank_account','income_tax_payer','owns_pucca_house'].forEach(k => set(k, g(k)==='' ? '' : g(k)==='1'));
  renderFacts(); runMatch();
}
$('toggle-form').onclick = () => { $('form').classList.toggle('hidden'); applyToggle(); };
function applyToggle() { $('toggle-form').textContent = $('form').classList.contains('hidden') ? t().form : t().formHide; }

/* ------------------------------------------------------------ find flow */
async function findFromText() {
  const text = $('said').value.trim(); if (!text) return;
  try {
    const r = await api('/api/parse', {text});
    Object.assign(profile, r.profile);
    buildForm(); renderFacts(); await runMatch();
  } catch (e) { $('results').innerHTML = `<div class="card">${t().err}</div>`; }
}
$('go').onclick = findFromText;

async function runMatch() {
  if (!Object.keys(profile).length) { $('results').innerHTML=''; $('followups').innerHTML=''; lastMatch=null; return; }
  try { lastMatch = await api('/api/match', {profile}); renderResults(lastMatch); }
  catch (e) { $('results').innerHTML = `<div class="card">${t().err}</div>`; }
}

function followupWidget(q) {
  const f = q.field, text = lang==='hi' ? q.q_hi : q.q_en;
  let ctl = '';
  if (BOOL_FIELDS.has(f)) ctl = `<button class="btn sm" data-f="${f}" data-v="1">${t().yes}</button><button class="btn alt sm" data-f="${f}" data-v="0">${t().no}</button>`;
  else if (f==='rural') ctl = `<button class="btn sm" data-f="rural" data-v="1">${t().village}</button><button class="btn alt sm" data-f="rural" data-v="0">${t().city}</button>`;
  else if (f==='gender') ctl = `<button class="btn sm" data-f="gender" data-v="female">${t().female}</button><button class="btn alt sm" data-f="gender" data-v="male">${t().male}</button>`;
  else if (f==='category') ctl = Object.entries(t().cat).map(([k,v])=>`<button class="btn alt sm" data-f="category" data-v="${k}">${v}</button>`).join('');
  else if (f==='occupation') ctl = `<select data-sel="occupation" style="max-width:260px"><option value="">…</option>${Object.entries(t().occ).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`;
  else if (f==='state') ctl = `<select data-sel="state" style="max-width:260px"><option value="">…</option>${STATES.map(s=>`<option value="${s}">${cap(s)}</option>`).join('')}</select>`;
  else ctl = `<input type="number" data-num="${f}" style="max-width:160px" placeholder="${f==='annual_income'?'₹/year':f==='land_acres'?'acres':''}"><button class="btn sm" data-setnum="${f}">${t().set}</button>`;
  return `<div class="row"><b style="flex:1;min-width:200px">${esc(text)}</b></div><div class="row">${ctl}</div>`;
}
function renderFollowups(m) {
  const q = (m.next_questions || [])[0];
  if (!q) { $('followups').innerHTML=''; return; }
  $('followups').innerHTML = `<div class="q"><span class="muted">💡 ${t().askMore} <span class="muted">(+${q.unlocks})</span></span>${followupWidget(q)}</div>`;
  const box = $('followups');
  box.querySelectorAll('button[data-f]').forEach(b => b.onclick = () => {
    const v = b.dataset.v; profile[b.dataset.f] = (v==='1') ? true : (v==='0') ? false : v; afterAnswer(); });
  box.querySelectorAll('select[data-sel]').forEach(s => s.onchange = () => { if (s.value) { profile[s.dataset.sel] = s.value; afterAnswer(); } });
  box.querySelectorAll('button[data-setnum]').forEach(b => b.onclick = () => {
    const i = box.querySelector(`input[data-num="${b.dataset.setnum}"]`); if (i.value!=='') { profile[b.dataset.setnum] = +i.value; afterAnswer(); } });
}
function afterAnswer() { buildForm(); renderFacts(); runMatch(); }

function schemeCard(s) {
  const name = lang==='hi' ? (s.name_hi || s.name) : s.name;
  const benefit = lang==='hi' ? (s.benefit_hi || s.benefit) : s.benefit;
  const badgeKey = s.status==='eligible' ? 'eligible' : s.status==='likely' ? 'likely' : 'near';
  const near = s.near_miss ? `<div class="near">💡 ${esc(lang==='hi' ? (s.near_miss.hi || s.near_miss.en) : s.near_miss.en)}</div>` : '';
  const why = s.passed.length ? `<details><summary>${t().why}</summary><ul class="why">${s.passed.map(x=>`<li>✓ ${esc(x)}</li>`).join('')}${s.unknown.map(x=>`<li>? ${esc(x)}</li>`).join('')}</ul></details>` : '';
  const warn = s.needs_state_verification ? `<div class="warn">⚠️ ${t().verify}</div>` : '';
  const spoken = `${name}. ${benefit}`;
  return `<div class="scheme">
    <div><span class="badge b-${s.status}">${t()[badgeKey]}</span><span class="badge b-level">${t().level[s.level]}</span></div>
    <h3 style="margin-top:6px">${esc(name)}</h3>
    <div class="benefit">${esc(benefit)}</div>
    ${near}${warn}
    ${why}
    <details><summary>${t().docs}</summary><ul>${s.documents.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></details>
    <details><summary>${t().steps}</summary><ol>${s.steps.map(d=>`<li>${esc(d)}</li>`).join('')}</ol><div class="muted" style="margin-top:6px">${t().deadline}: ${esc(s.deadline)}</div></details>
    <div class="row" style="margin-top:10px">
      <a class="btn sm" href="${esc(s.apply_url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${t().apply} ↗</a>
      <button class="btn alt sm" data-speak="${esc(spoken)}">${t().listen}</button>
      <span class="muted">${esc(new URL(s.apply_url).hostname)}</span>
    </div></div>`;
}
function bannerHtml(tot, title) {
  const cells = [];
  if (tot.yearly_cash) cells.push(`<div class="stat"><b>${inr(tot.yearly_cash)}</b><span>${t().yearly}</span></div>`);
  if (tot.one_time_cash) cells.push(`<div class="stat"><b>${inr(tot.one_time_cash)}</b><span>${t().oneTime}</span></div>`);
  if (tot.insurance_cover) cells.push(`<div class="stat"><b>${inr(tot.insurance_cover)}</b><span>${t().cover}</span></div>`);
  cells.push(`<div class="stat"><b>${tot.count_eligible}</b><span>${t().eligible}</span></div>`);
  if (tot.count_likely) cells.push(`<div class="stat"><b>${tot.count_likely}</b><span>${t().likely}</span></div>`);
  const pot = [];
  if (tot.potential_yearly_cash) pot.push(inr(tot.potential_yearly_cash) + ' / ' + (lang==='hi'?'वर्ष':'yr'));
  if (tot.potential_one_time_cash) pot.push(inr(tot.potential_one_time_cash) + ' ' + (lang==='hi'?'एकमुश्त':'one-time'));
  if (tot.potential_insurance_cover) pot.push(inr(tot.potential_insurance_cover) + ' ' + t().cover);
  const potLine = pot.length ? `<div style="font-size:13px;margin-top:10px;opacity:.95">＋ ${t().potential} <b>${pot.join(' · ')}</b></div>` : '';
  return `<div class="banner"><h2>${esc(title)}</h2><div class="stats">${cells.join('')}</div>${potLine}<div style="font-size:12px;opacity:.8;margin-top:10px">${t().note}</div></div>`;
}
function bindSpeak(root) { root.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => speak(b.dataset.speak)); }
function renderResults(m) {
  const by = k => m.schemes.filter(s => s.status===k);
  const sec = (title, arr) => arr.length ? `<h2 class="sec">${title} (${arr.length})</h2>${arr.map(schemeCard).join('')}` : '';
  $('results').innerHTML = m.schemes.length
    ? bannerHtml(m.totals, t().banner) + sec(t().secElig, by('eligible')) + sec(t().secLikely, by('likely')) + sec(t().secNear, by('near_miss'))
    : `<div class="card">${t().none}</div>`;
  bindSpeak($('results'));
  renderFollowups(m);
}

function cleanMember(m) {
  const o = {};
  if (m.name) o.name = m.name;
  if (m.age!=='' && m.age!=null) o.age = +m.age;
  if (m.gender) o.gender = m.gender;
  if (m.occupation) o.occupation = m.occupation;
  if (m.land_acres!=='' && m.land_acres!=null) o.land_acres = +m.land_acres;
  if (m.has_bank_account!=='' && m.has_bank_account!=null) o.has_bank_account = (m.has_bank_account===true||m.has_bank_account==='1');
  return o;
}
async function runFamily() {
  readHousehold();
  const household = Object.fromEntries(Object.entries(hh).filter(([,v]) => v !== undefined));
  try { famLast = await api('/api/family', {household, members: members.map(cleanMember)}); renderFamily(famLast); }
  catch (e) { $('family-results').innerHTML = `<div class="card">${t().err}</div>`; }
}
$('go-family').onclick = runFamily;
function renderFamily(f) {
  $('family-results').innerHTML = bannerHtml(f.totals, t().total) + f.members.map(m => {
    const shown = m.schemes.filter(s => s.status !== 'near_miss');
    const near = m.schemes.filter(s => s.status === 'near_miss');
    return `<h2 class="sec">${esc(m.name)} (${shown.length})</h2>` + (shown.concat(near).map(schemeCard).join('') || `<div class="card muted">${t().none}</div>`);
  }).join('');
  bindSpeak($('family-results'));
}

/* ------------------------------------------------------------ scam shield */
async function runScam() {
  const text = $('scam-text').value.trim(); if (!text) return;
  try {
    const r = await api('/api/scam', {text});
    const urls = r.urls.map(u => `<div style="margin-top:8px"><b>${esc(u.host || u.url)}</b> — <span class="badge ${u.verdict==='official'?'b-eligible':u.verdict==='suspicious'?'':'b-likely'}" ${u.verdict==='suspicious'?'style="background:#fdeaea;color:#b42318"':''}>${t().verdictL[u.verdict]}</span><ul class="why">${u.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
    $('scam-out').innerHTML = `<div class="risk ${r.risk}"><b style="font-size:17px">${t().risk[r.risk]}</b> <span class="muted">(${r.score}/100)</span>
      ${r.flags.length?`<ul>${r.flags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${urls}
      <div style="margin-top:10px;color:var(--ink);font-size:14px"><ul>${r.advice.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
  } catch (e) { $('scam-out').innerHTML = `<div class="card">${t().err}</div>`; }
}
$('go-scam').onclick = runScam;

/* ------------------------------------------------------------ boot */
applyLang(); applyToggle();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
